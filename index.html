    function updateLayoutButtons() {
      byId('organize-tree').disabled = arranging || !data;
      byId('organize-family').disabled = arranging || !data || !selectedId;
      byId('undo-layout').disabled = arranging || !layoutUndo || !FamilyRecord.equal(data?.layout ?? null, layoutUndo.after) || layoutUndo.topology !== FamilyRecord.topologyKey(data);
    }

    async function organizeTree(undo = false, familyOnly = false) {
      if (arranging || saving || !data || byId('record-dialog').open) return;
      const before = FamilyRecord.copy(data.layout ?? null);
      const topology = FamilyRecord.topologyKey(data);
      if (undo && (!layoutUndo || layoutUndo.topology !== topology || !FamilyRecord.equal(before, layoutUndo.after))) return;
      arranging = true;
      const controls = [...document.querySelectorAll('.toolbar button, #view, #search')].map(control => [control, control.disabled]);
      for (const [control] of controls) control.disabled = true;
      byId('workspace').inert = true;
      byId('message').textContent = '';
      byId('storage-status').textContent = undo ? 'Restoring layout...' : familyOnly ? 'Organizing family...' : 'Organizing tree...';
      try {
        const baseline = before ?? FamilyLayout.organize(data);
        const layout = undo ? FamilyRecord.copy(layoutUndo.before) : familyOnly ? FamilyLayout.organizeBranch(data, familyBranch(selectedId), baseline.positions) : FamilyLayout.organize(data, before?.positions);
        FamilyRecord.validateLayout(layout, data);
        const summary = undo ? 'Restored the previous tree layout' : familyOnly ? 'Organized the selected family branch' : 'Organized the whole tree';
        let updated;
        if (sharedMode) {
          const result = await sharedRequest('state', {method: 'PATCH', body: {revision: sharedRevision, layout, before, summary, source: 'Tree arrangement'}});
          validateData(result.record);
          updated = result.record;
          sharedRevision = result.revision;
        } else {
          const candidate = FamilyRecord.copy(data);
          if (layout) candidate.layout = layout; else delete candidate.layout;
          updated = FamilyRecord.commit(data, candidate, {actor: byId('contributor').value.trim() || 'Local viewer', action: 'edit', summary, source: 'Tree arrangement'}) ?? data;
          validateData(updated); persistRecord(updated);
        }
        if (undo) layoutUndo = null;
        else if (!FamilyRecord.equal(before, updated.layout ?? null)) layoutUndo = {before, after: FamilyRecord.copy(updated.layout ?? null), topology};
        byId('view').value = 'all';
        applySavedRecord(updated, 'layout', selectedId);
        fitView();
        byId('storage-status').textContent = sharedMode ? 'Layout saved · Revision ' + sharedRevision : storageAvailable ? 'Layout saved on this device' : 'Layout kept in this session';
      } catch (error) {
        byId('message').textContent = error.message;
        byId('storage-status').textContent = 'Layout not saved';
      } finally {
        arranging = false;
        byId('workspace').inert = false;
        for (const [control, disabled] of controls) control.disabled = disabled;
        updateLayoutButtons();
      }
    }

    function layoutTree(ids) {
      const saved = ids.size === people.size && data.layout?.topology === FamilyRecord.topologyKey(data) ? data.layout : null;
      const key = FamilyRecord.topologyKey(data) + '|' + JSON.stringify([...ids].sort());
      if (saved) positions = new Map(Object.entries(saved.positions).map(([id, position]) => [id, {...position}]));
      else {
        if (layoutCache?.key !== key) layoutCache = {key, positions: FamilyLayout.initial(data, ids).positions};
        positions = new Map([...layoutCache.positions].map(([id, position]) => [id, {...position}]));
      }
      diagram = FamilyLayout.bounds(positions);
    }

    function drawPath(path, familyId, className = '', childId = '') {
      const node = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      node.setAttribute('d', path);
      node.setAttribute('class', className);
      node.dataset.familyId = familyId;
      node.dataset.childId = childId;
      edgesLayer.append(node);
    }

    function highlightBranch(ids = null) {
      const active = ids instanceof Set;
      scene.classList.toggle('branch-highlight', active);
      edgesLayer.classList.toggle('branch-highlight', active);
      for (const person of peopleLayer.querySelectorAll('.person')) {
        const related = active && ids.has(person.dataset.personId);
        person.classList.toggle('branch-active', related);
        person.classList.toggle('branch-muted', active && !related);
      }
      for (const household of householdsLayer.children) {
        const family = data.families.find(item => item.id === household.dataset.familyId);
        const related = active && [...family.parentIds, ...family.childIds].some(id => ids.has(id));
        household.classList.toggle('branch-active', related);
        household.classList.toggle('branch-muted', active && !related);
      }
      for (const edge of edgesLayer.children) {
        const family = data.families.find(item => item.id === edge.dataset.familyId);
        const related = active && [...family.parentIds, ...family.childIds].some(id => ids.has(id));
        edge.classList.toggle('branch-active', related);
        edge.classList.toggle('branch-muted', active && !related);
      }
    }

    function renderTree() {
      const ids = visiblePeople();
      layoutTree(ids);
      householdsLayer.replaceChildren();
      peopleLayer.replaceChildren();
      edgesLayer.replaceChildren();
      scene.style.width = diagram.width + 'px';
      scene.style.height = diagram.height + 'px';
      const generations = byId('generations'); generations.replaceChildren();
      const levels = [...new Set([...positions.values()].map(position => position.y))].sort((first, second) => first - second);
      let generationNumber = 0;
      for (const [index, level] of levels.entries()) {
        const startsGeneration = !index || level - levels[index - 1] > cardHeight + generationLaneGap + 1;
        if (startsGeneration) generationNumber++;
        const guide = element('div', 'generation-guide'); guide.style.top = level - 14 + 'px';
        if (startsGeneration) guide.append(element('span', '', 'Generation ' + generationNumber));
        generations.append(guide);
      }
      edgesLayer.setAttribute('width', diagram.width);
      edgesLayer.setAttribute('height', diagram.height);
      for (const family of data.families) {
        const parentIds = family.parentIds.filter(id => positions.has(id));
        if (parentIds.length !== 2) continue;
        const parents = parentIds.map(id => positions.get(id));
        if (Math.abs(parents[0].y - parents[1].y) > 0.1) continue;
        const left = Math.min(...parents.map(position => position.x)) - 7;
        const right = Math.max(...parents.map(position => position.x)) + cardWidth + 7;
        const household = element('div', 'household');
        household.dataset.familyId = family.id;
        household.style.left = left + 'px'; household.style.top = parents[0].y - 7 + 'px';
        household.style.width = right - left + 'px'; household.style.height = cardHeight + 14 + 'px';
        household.addEventListener('pointerenter', () => highlightBranch(familyBranch(parentIds[0])));
        household.addEventListener('pointerleave', () => highlightBranch());
        householdsLayer.append(household);
      }
      function clearCorridor(preferred, fromY, toY, owners) {
        const candidates = [preferred, diagramMargin / 2, diagram.width - diagramMargin / 2];
        for (const [id, position] of positions) if (!owners.has(id)) candidates.push(position.x - 10, position.x + cardWidth + 10);
        const low = Math.min(fromY, toY);
        const high = Math.max(fromY, toY);
        return candidates.filter(x => x >= 0 && x <= diagram.width).sort((first, second) => Math.abs(first - preferred) - Math.abs(second - preferred)).find(x => {
          for (const [id, position] of positions) if (!owners.has(id) && position.y < high && position.y + cardHeight > low && x > position.x && x < position.x + cardWidth) return false;
          return true;
        }) ?? preferred;
      }
      const lanes = new Map();
      for (const family of data.families) {
        const parentIds = family.parentIds.filter(id => positions.has(id));
        const parents = parentIds.map(id => positions.get(id));
        const children = family.childIds.filter(id => positions.has(id)).map(id => ({...positions.get(id), id}));
        if (!parents.length) continue;
        const centers = parents.map(position => position.x + cardWidth / 2);
        const sourceX = (Math.min(...centers) + Math.max(...centers)) / 2;
        const sourceY = parents[0].y + (parents.length > 1 ? cardHeight / 2 : cardHeight);
        if (parents.length > 1) drawPath(`M ${Math.min(...centers)} ${sourceY} H ${Math.max(...centers)}`, family.id, 'partner');
        if (!children.length) continue;
        const childLevel = Math.min(...children.map(position => position.y));
        const lane = lanes.get(childLevel) ?? 0;
        lanes.set(childLevel, lane + 1);
        const busY = childLevel - 22 - lane * 12;
        const trunkY = parents[0].y + cardHeight + 10;
        const corridorX = clearCorridor(sourceX, trunkY, busY, new Set([...parentIds, ...children.map(child => child.id)]));
        for (const child of children) drawPath(`M ${sourceX} ${sourceY} V ${trunkY} H ${corridorX} V ${busY} H ${child.x + cardWidth / 2} V ${child.y}`, family.id, '', child.id);
      }
      for (const [id, position] of positions) {
        const person = people.get(id);
        const identityStatus = identificationText(person);
        const age = FamilyRecord.calculatedAge(person) ?? (person.death?.age != null ? {years: person.death.age, atDeath: true, uncertain: isUncertain(person, 'death.age')} : null);
        const ageDescription = age ? (age.atDeath ? 'Age at death: ' : 'Age today, no death recorded: ') + age.years + ' years' + (age.uncertain ? ' (uncertain)' : '') : '';
        const facts = [['birth.place', 'Born in', person.birth?.place], ['death.place', 'Died in', person.death?.place], ['origin', 'From', person.origin], ['movedTo', 'Moved to', person.movedTo]].filter(([, , value]) => typeof value === 'string' && value.trim());
        const button = element('button', 'person' + (id === selectedId ? ' selected' : '') + (identityStatus ? ' identity-uncertain' : ''));
        const siblingFamily = data.families.find(family => family.childIds.includes(id) && family.childIds.filter(childId => positions.has(childId)).length > 1);
        if (siblingFamily) {
          const siblingColors = ['#4f7f68', '#537da3', '#a56f2a', '#9a5964', '#4e8584'];
          const colorIndex = [...siblingFamily.id].reduce((sum, character) => sum + character.charCodeAt(0), 0) % siblingColors.length;
          button.classList.add('sibling-group'); button.style.setProperty('--sibling-color', siblingColors[colorIndex]);
        }
        button.dataset.personId = id;
        button.style.left = position.x + 'px';
        button.style.top = position.y + 'px';
        button.setAttribute('aria-label', [person.name || 'Name unknown', ageDescription, identityStatus].filter(Boolean).join(', '));
        button.title = [person.name || 'Name unknown', ageDescription, identityStatus, ...facts.map(([field, label, value]) => label + ': ' + value + (isUncertain(person, field) ? ' (uncertain)' : ''))].filter(Boolean).join('\n');
        button.setAttribute('aria-pressed', String(id === selectedId));
        const heading = element('span', 'person-heading');
        if (identityStatus) {
          const marker = element('span', 'identity-marker');
          marker.setAttribute('aria-hidden', 'true');
          heading.append(marker);
        }
        const identity = element('span', 'person-identity');
        identity.append(fieldValue(person, 'name', person.name || 'Name unknown', 'person-name'));
        if (age) {
          const badge = element('span', 'person-age' + (age.uncertain ? ' uncertain' : ''), '(' + age.years + (age.atDeath ? ' at death' : '') + (age.uncertain ? ' ?' : '') + ')');
          badge.title = ageDescription;
          badge.dataset.ageReference = age.atDeath ? 'death' : 'today';
          identity.append(' ', badge);
        }
        heading.append(identity);
        button.append(heading);
        const dates = element('span', 'person-dates');
        if (dateText(person.birth) !== 'Unknown') { const date = dateValue(person, 'birth'); date.prepend('b. '); dates.append(date); }
        if (dateText(person.death) !== 'Unknown') { const date = dateValue(person, 'death'); date.prepend('d. '); dates.append(date); }
        if (!dates.childNodes.length) dates.textContent = 'Dates unknown';
        button.append(dates);
        if (facts.length) {
          const summary = element('span', 'person-facts');
          for (const [field, label, value] of facts.slice(0, 2)) {
            const uncertain = isUncertain(person, field);
            const fact = element('span', 'person-fact' + (uncertain ? ' uncertain' : ''));
            fact.dataset.factField = field;
            fact.title = label + ': ' + value + (uncertain ? ' (uncertain)' : '');
            fact.append(element('span', 'person-fact-label', label + ':'), element('span', 'person-fact-value', value));
            if (uncertain) fact.append(element('span', 'person-fact-marker', '?'));
            summary.append(fact);
          }
          button.append(summary);
        }
        button.addEventListener('click', () => selectPerson(id, false, true));
        if (siblingFamily) {
          button.addEventListener('pointerenter', () => highlightBranch(familyBranch(id)));
          button.addEventListener('pointerleave', () => highlightBranch());
        }
        button.addEventListener('focus', () => { if (!isVisible(position)) centerOn(id); });
        peopleLayer.append(button);
        for (const fontSize of [12, 11]) {
          if (button.scrollHeight <= button.clientHeight) break;
          button.style.setProperty('--person-font-size', fontSize + 'px');
        }
        if (button.scrollHeight > button.clientHeight) button.classList.add('name-truncated');
      }
      byId('visible-count').textContent = `${ids.size} of ${people.size} people`;
      byId('total').textContent = `${people.size} people / ${data.families.length} families`;
      updateLayoutButtons();
      renderConnection(); lucide.createIcons();
    }

    function isVisible(position) {
      const centerX = camera.x + (position.x + cardWidth / 2) * camera.scale;
      const centerY = camera.y + (position.y + cardHeight / 2) * camera.scale;
      return centerX >= 0 && centerX <= viewport.clientWidth && centerY >= 0 && centerY <= viewport.clientHeight;
    }

    function cameraUpdate() {
      scene.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.scale})`;
      byId('zoom-label').textContent = Math.round(camera.scale * 100) + '%';
    }

    function zoom(factor, anchorX = viewport.clientWidth / 2, anchorY = viewport.clientHeight / 2) {
      const newScale = Math.max(0.12, Math.min(2.2, camera.scale * factor));
      const ratio = newScale / camera.scale;
      camera = {x: anchorX - (anchorX - camera.x) * ratio, y: anchorY - (anchorY - camera.y) * ratio, scale: newScale};
      cameraUpdate();
    }

    function fitView() {
      const scale = Math.min(1, (viewport.clientWidth - 28) / diagram.width, (viewport.clientHeight - 28) / diagram.height);
      camera = {scale: Math.max(0.01, scale), x: (viewport.clientWidth - diagram.width * scale) / 2, y: (viewport.clientHeight - diagram.height * scale) / 2};
      cameraUpdate();
    }

    function centerOn(id, resetScale = false) {
      const position = positions.get(id);
      if (!position) { fitView(); return; }
      if (resetScale) camera.scale = viewport.clientWidth < 600 ? 0.75 : 0.9;
      camera.x = viewport.clientWidth / 2 - (position.x + cardWidth / 2) * camera.scale;
      camera.y = viewport.clientHeight * 0.58 - (position.y + cardHeight / 2) * camera.scale;
      cameraUpdate();
    }

    function detailsAreOpen() {
      return mobileLayout.matches ? mobileDetailsOpen : desktopDetailsOpen;
    }

    function syncDetailsVisibility() {
      const open = detailsAreOpen();
      byId('workspace').classList.toggle('details-hidden', !open);
      byId('toggle-details').setAttribute('aria-expanded', String(open));
    }

    function setDetailsOpen(open) {
      if (mobileLayout.matches) mobileDetailsOpen = open;
      else desktopDetailsOpen = open;
      syncDetailsVisibility();
      if (connectionPath) fitConnection(); else centerOn(selectedId);
    }

    function closeMobileDetails() {
      setDetailsOpen(false);
      peopleLayer.querySelector('[data-person-id="' + CSS.escape(selectedId) + '"]')?.focus({preventScroll: true});
    }

    function renderDetails() {
      const person = people.get(selectedId);
      const sidebar = byId('details');
      const heading = element('div', 'details-header');
      const title = element('h2');
      title.append(activeTab === 'all-activity' ? 'All activity' : fieldValue(person, 'name', person.name || 'Name unknown'));
      heading.append(title);
      heading.append(iconButton('Hide person details', 'chevron-down', closeMobileDetails, 'icon-button sheet-close'));
      heading.append(element('p', 'person-position', activeTab === 'all-activity' ? (data.activityLog?.length ?? 0) + ' entries · Self-reported contributors' : person.id === data.focusPersonId ? 'Starting person' : 'Family record'));
      if (activeTab !== 'all-activity') {
        const actions = element('div', 'sidebar-actions');
        actions.append(iconButton('Edit person', 'pencil', editPerson), iconButton('Add parent', 'arrow-up', () => addRelative('parent')), iconButton('Add child', 'arrow-down', () => addRelative('child')), iconButton('Add relative', 'user-plus', () => addRelative()), iconButton('Find connection', 'route', openConnection));
        const deletion = iconButton('Delete person', 'trash-2', deletePerson, 'icon-button danger');
        deletion.disabled = FamilyRecord.initialPersonIds.includes(person.id);
        if (deletion.disabled) deletion.title = 'Original family member: deletion is protected';
        actions.append(deletion);
        heading.append(actions);
      }
      const tabs = element('div', 'detail-tabs'); tabs.setAttribute('role', 'tablist'); tabs.setAttribute('aria-label', 'Person record');
      const tabIds = ['person', 'evidence', 'notes', 'activity', 'all-activity'];
      for (const [index, label] of ['Person', 'Evidence', 'Notes', 'Activity', 'All activity'].entries()) {
        const tabId = tabIds[index];
        const button = element('button', '', label); button.id = 'tab-' + tabId; button.setAttribute('role', 'tab'); button.setAttribute('aria-selected', String(activeTab === tabId)); button.setAttribute('aria-controls', 'detail-content'); button.tabIndex = activeTab === tabId ? 0 : -1;
        button.addEventListener('click', () => { activeTab = tabId; activityQuery = ''; renderDetails(); byId('tab-' + tabId).focus({preventScroll: true}); });
        button.addEventListener('keydown', event => { if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return; event.preventDefault(); activeTab = tabIds[event.key === 'Home' ? 0 : event.key === 'End' ? tabIds.length - 1 : (index + (event.key === 'ArrowRight' ? 1 : -1) + tabIds.length) % tabIds.length]; activityQuery = ''; renderDetails(); byId('tab-' + activeTab).focus({preventScroll: true}); });
        tabs.append(button);
      }
      const panel = element('div'); panel.id = 'detail-content'; panel.setAttribute('role', 'tabpanel'); panel.setAttribute('aria-labelledby', 'tab-' + activeTab); panel.tabIndex = 0;
      sidebar.replaceChildren(heading, tabs, panel);
      if (['activity', 'all-activity'].includes(activeTab)) { renderActivity(panel, activeTab === 'all-activity'); lucide.createIcons(); return; }
      if (activeTab === 'notes') {
        const toolbar = element('div', 'panel-toolbar'); toolbar.append(iconButton('Add note', 'plus', () => editNote(), 'command')); panel.append(toolbar);
        if (!person.notes?.length) panel.append(element('p', 'empty-state', 'No notes recorded.'));
        const noteIds = FamilyRecord.noteIdsFor(person);
        const protectedIds = FamilyRecord.protectedNoteIds(person.id);
        for (const [index, note] of (person.notes ?? []).entries()) {
          const item = element('div', 'record-note'); item.dataset.noteId = noteIds[index];
          item.append(element('p', 'note', note), iconButton('Edit note ' + (index + 1), 'pencil', () => editNote(index)));
          if (protectedIds.includes(noteIds[index])) item.append(element('span', 'note-protection', 'Initial note'));
          else item.append(iconButton('Delete note ' + (index + 1), 'trash-2', () => deleteNote(index), 'icon-button danger'));
          panel.append(item);
        }
        lucide.createIcons(); return;
      }
      if (activeTab === 'person') {
      const list = element('dl');
      function field(label, value, className = '') { const content = element('dd', className); content.append(value); list.append(element('dt', '', label), content); }
      const identityStatus = identificationText(person);
      if (identityStatus) field('Identification', identityStatus, 'identity-status');
      if (person.identification?.status === 'confirmed') field('Identification', 'Confirmed (family assessment)');
      if (person.identification?.confidencePercent != null) field('Confidence estimate', fieldValue(person, 'identification.confidencePercent', person.identification.confidencePercent + '%'));
      if (person.identification?.basis) field('Assessment basis', fieldValue(person, 'identification.basis', person.identification.basis));
      field('Born', dateValue(person, 'birth'));
      field('Birthplace', fieldValue(person, 'birth.place', person.birth?.place));
      if (person.death) {
        field('Died', dateValue(person, 'death'));
        if (person.death.place) field('Place of death', fieldValue(person, 'death.place', person.death.place));
      }
      const age = FamilyRecord.calculatedAge(person);
      if (age) {
        const value = element('span', age.uncertain ? 'uncertain' : '', age.years + (age.years === 1 ? ' year' : ' years') + (age.uncertain ? ' ?' : ''));
        value.dataset.calculatedAge = age.atDeath ? 'death' : 'today';
        value.title = age.atDeath ? 'Calculated from the recorded birth and death dates.' : 'Calculated from birth date to today; no death is recorded.';
        field(age.atDeath ? 'Age at death' : 'Age', value);
      } else if (person.death?.age != null) field('Age at death', fieldValue(person, 'death.age', person.death.age + ' years'));
      if (person.origin) field('Family origin', fieldValue(person, 'origin', person.origin));
      if (person.movedTo) field('Moved to', fieldValue(person, 'movedTo', person.movedTo));
      if (person.nameVariants?.length) field('Reported name variants', fieldValue(person, 'nameVariants', person.nameVariants.join('; ')));
      panel.append(list);
      function relatives(title, ids) {
        const uniqueIds = [...new Set(ids)].filter(id => id !== selectedId);
        if (!uniqueIds.length) return;
        panel.append(element('h3', '', title));
        for (const id of uniqueIds) {
          const button = element('button', 'relative', people.get(id).name || 'Name unknown');
          button.dataset.relativeId = id;
          button.addEventListener('click', () => selectPerson(id, true));
          panel.append(button);
        }
      }
      const parentFamilies = data.families.filter(family => family.childIds.includes(selectedId));
      const childFamilies = data.families.filter(family => family.parentIds.includes(selectedId));
      relatives('Parents', parentFamilies.flatMap(family => family.parentIds));
      relatives('Partners / Co-parents', childFamilies.flatMap(family => family.parentIds));
      relatives('Children', childFamilies.flatMap(family => family.childIds));
      relatives('Siblings', parentFamilies.flatMap(family => family.childIds));
      lucide.createIcons(); return;
      }
      const toolbar = element('div', 'panel-toolbar'); toolbar.append(iconButton('Add evidence', 'file-plus-2', () => editEvidence(), 'command')); panel.append(toolbar);
      const leads = (data.researchLeads ?? []).filter(lead => lead.personIds.includes(selectedId));
      if (!leads.length) panel.append(element('p', 'empty-state', 'No evidence recorded.'));
      for (const lead of leads) {
        const section = element('div', 'lead');
        section.append(element('strong', '', lead.status), element('p', '', lead.summary));
        if (lead.reference) section.append(element('p', '', lead.reference));
        for (const [index, address] of (lead.sourceUrls ?? []).entries()) {
          try {
            const url = new URL(address);
            if (!['https:', 'http:'].includes(url.protocol)) continue;
            const link = element('a', '', 'Source ' + (index + 1));
            link.href = url.href;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            section.append(link);
          } catch {}
        }
        section.append(iconButton('Edit evidence', 'pencil', () => editEvidence(lead.id)));
        panel.append(section);
      }
      lucide.createIcons();
    }

    function selectPerson(id, center, toggleMobileDetails = false) {
      const hideSheet = toggleMobileDetails && id === selectedId && mobileDetailsOpen && activeTab !== 'all-activity';
      selectedId = id;
      if (mobileLayout.matches) {
        mobileDetailsOpen = !hideSheet;
        if (activeTab === 'all-activity') { activeTab = 'person'; activityQuery = ''; }
        syncDetailsVisibility();
      }
      const mode = byId('view').value;
      if (!positions.has(id) && !['family', 'ancestors', 'descendants'].includes(mode)) byId('view').value = 'all';
      if (mode === 'family' || mode === 'ancestors' || mode === 'descendants' || !positions.has(id)) renderTree();
      else for (const button of peopleLayer.querySelectorAll('.person')) { const selected = button.dataset.personId === id; button.classList.toggle('selected', selected); button.setAttribute('aria-pressed', String(selected)); }
      renderDetails();
      if (center) centerOn(id, true);
      else if (mobileLayout.matches) centerOn(id);
    }

    function closeSearch() {
      byId('search-results').hidden = true;
      byId('search').setAttribute('aria-expanded', 'false');
      byId('search').removeAttribute('aria-activedescendant');
      activeResult = -1;
    }

    const normalize = text => text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    function chooseResult(id) { byId('search').value = ''; closeSearch(); selectPerson(id, true); }
    byId('search').addEventListener('input', event => {
      const query = normalize(event.target.value.trim());
      const list = byId('search-results');
      list.replaceChildren();
      activeResult = -1;
      if (!query) { closeSearch(); return; }
      results = data.people.filter(person => normalize([person.name, ...(person.nameVariants ?? [])].join(' ')).includes(query)).slice(0,15);
      for (const [index, person] of results.entries()) {
        const item = element('li');
        item.setAttribute('role', 'presentation');
        const button = element('button', '', person.name || 'Name unknown');
        button.id = 'result-' + index;
        button.setAttribute('role', 'option');
        button.setAttribute('aria-selected', 'false');
        button.addEventListener('click', () => chooseResult(person.id));
        item.append(button);
        list.append(item);
      }
      if (!results.length) list.append(element('li', 'empty', 'No matches'));
      list.hidden = false;
      event.target.setAttribute('aria-expanded', 'true');
    });
    byId('search').addEventListener('keydown', event => {
      if (event.key === 'Escape') { closeSearch(); return; }
      if (byId('search-results').hidden || !results.length) return;
      if (event.key === 'Enter') { event.preventDefault(); chooseResult(results[Math.max(0, activeResult)].id); return; }
      if (!['ArrowDown','ArrowUp'].includes(event.key)) return;
      event.preventDefault();
      activeResult = (activeResult + (event.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length;
      for (const [index, button] of [...byId('search-results').querySelectorAll('button')].entries()) button.setAttribute('aria-selected', String(index === activeResult));
      event.target.setAttribute('aria-activedescendant', 'result-' + activeResult);
      byId('result-' + activeResult).scrollIntoView({block:'nearest'});
    });
    document.querySelector('.search').addEventListener('focusout', event => { if (!event.currentTarget.contains(event.relatedTarget)) closeSearch(); });
    byId('view').addEventListener('change', () => { connectionPath = null; renderTree(); centerOn(selectedId, true); });
    byId('connect').addEventListener('click', openConnection);
    byId('organize-tree').addEventListener('click', () => { document.querySelector('.organize-menu').open = false; organizeTree(); });
    byId('organize-family').addEventListener('click', () => { document.querySelector('.organize-menu').open = false; organizeTree(false, true); });
    byId('undo-layout').addEventListener('click', () => organizeTree(true));
    byId('zoom-in').addEventListener('click', () => zoom(1.25));
    byId('zoom-out').addEventListener('click', () => zoom(0.8));
    byId('fit').addEventListener('click', fitView);
    byId('center').addEventListener('click', () => centerOn(selectedId, true));
    byId('toggle-details').addEventListener('click', () => setDetailsOpen(!detailsAreOpen()));
    byId('details').addEventListener('keydown', event => {
      if (event.key === 'Escape' && mobileLayout.matches && !byId('record-dialog').open) { event.preventDefault(); closeMobileDetails(); }
    });
    mobileLayout.addEventListener('change', () => {
      if (mobileLayout.matches) mobileDetailsOpen = false;
      syncDetailsVisibility();
      if (data) { if (connectionPath) fitConnection(); else centerOn(selectedId); }
    });
    viewport.addEventListener('wheel', event => { if (event.target.closest('#connection-bar')) return; event.preventDefault(); const bounds = viewport.getBoundingClientRect(); zoom(Math.exp(-event.deltaY * 0.002), event.clientX - bounds.left, event.clientY - bounds.top); }, {passive:false});
    viewport.addEventListener('pointerdown', event => {
      if (event.target.closest('button, #connection-bar') || event.button !== 0) return;
      drag = {pointerId:event.pointerId, x:event.clientX, y:event.clientY, cameraX:camera.x, cameraY:camera.y};
      viewport.setPointerCapture(event.pointerId);
      viewport.classList.add('dragging');
    });
    viewport.addEventListener('pointermove', event => { if (!drag || drag.pointerId !== event.pointerId) return; camera.x = drag.cameraX + event.clientX - drag.x; camera.y = drag.cameraY + event.clientY - drag.y; cameraUpdate(); });
    function finishDrag() { drag = null; viewport.classList.remove('dragging'); }
    viewport.addEventListener('pointerup', finishDrag);
    viewport.addEventListener('pointercancel', finishDrag);
    viewport.addEventListener('lostpointercapture', finishDrag);
    viewport.addEventListener('keydown', event => {
      if (event.target !== viewport) return;
      const directions = {ArrowLeft:[50,0], ArrowRight:[-50,0], ArrowUp:[0,50], ArrowDown:[0,-50]};
      if (directions[event.key]) { event.preventDefault(); camera.x += directions[event.key][0]; camera.y += directions[event.key][1]; cameraUpdate(); }
      if (event.key === '+' || event.key === '=') { event.preventDefault(); zoom(1.25); }
      if (event.key === '-') { event.preventDefault(); zoom(0.8); }
    });
    byId('load').addEventListener('click', () => byId('file').click());
    byId('contributor').addEventListener('change', event => rememberContributor(event.target.value));
    byId('history').addEventListener('click', () => { activeTab = 'all-activity'; activityQuery = ''; renderDetails(); setDetailsOpen(true); });
    byId('editor-close').addEventListener('click', () => { if (!saving) byId('record-dialog').close(); });
    byId('editor-cancel').addEventListener('click', () => { if (!saving) { if (conflictReview) returnToDraft(); else byId('record-dialog').close(); } });
    byId('record-dialog').addEventListener('cancel', event => { if (saving) event.preventDefault(); });
    byId('record-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (saving) return;
      saving = true;
      const button = byId('editor-save');
      button.disabled = true; button.textContent = 'Saving...';
      try { if (await (conflictReview ? saveConflictChoices() : editorSave()) !== false) byId('record-dialog').close(); }
      catch (error) { byId('editor-error').textContent = error.message; byId('editor-error').scrollIntoView({block: 'nearest'}); }
      finally { saving = false; button.disabled = false; button.textContent = conflictReview ? 'Save selected values' : editorSubmitLabel; }
    });
    byId('shared-refresh').addEventListener('click', async () => {
      if (saving || byId('record-dialog').open) return;
      byId('shared-refresh').disabled = true;
      try { await loadSharedTree(); }
      catch (error) { byId('message').textContent = error.message; }
      finally { byId('shared-refresh').disabled = false; }
    });
    byId('sign-out').addEventListener('click', async () => {
      if (saving || byId('record-dialog').open) return;
      try { await sharedRequest('logout', {method: 'POST', body: {}}); location.replace('./'); }
      catch (error) { byId('message').textContent = error.message; }
    });
    byId('review-local').addEventListener('click', () => reviewImport(pendingRecovery, 'Saved browser tree', true));
    byId('backup-local').addEventListener('click', () => downloadFile(lastStored, 'kindrd-backup.local.json', 'application/json'));
    byId('keep-snapshot').addEventListener('click', () => {
      openEditor('Discard saved local tree?', parent => parent.append(element('p', '', 'Unsaved exports from the stored tree will be lost. The tree embedded in this file will remain.')), () => {
        if (localStorage.getItem(storageKey) !== lastStored) throw new Error('Another tab changed the saved tree. Reload first.');
        localStorage.removeItem(storageKey); lastStored = null; pendingRecovery = null; invalidSaved = false; byId('recovery-bar').hidden = true; byId('message').textContent = ''; byId('storage-status').textContent = 'Local snapshot';
      }, '', 'Discard saved tree', false);
    });
    byId('file').addEventListener('change', async event => {
      const file = event.target.files[0];
      if (!file) return;
      try { const parsed = JSON.parse(await file.text()); const candidate = validateData(parsed?.record && typeof parsed.baseline === 'string' ? parsed.record : parsed); reviewImport(candidate, file.name); byId('message').textContent = ''; }
      catch (error) { byId('message').textContent = 'Could not load data: ' + error.message; }
      event.target.value = '';
    });
    function downloadFile(content, filename, type) {
      const url = URL.createObjectURL(new Blob([content], {type}));
      const link = element('a');
      link.href = url; link.download = filename; link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    byId('download').addEventListener('click', () => downloadFile(JSON.stringify(data, null, 2), 'family-data.local.json', 'application/json'));
    byId('download-html').addEventListener('click', () => {
      const output = standaloneTemplate.cloneNode(true);
      delete output.querySelector('body').dataset.sharedTree;
      for (const script of output.querySelectorAll('script[nonce]')) script.removeAttribute('nonce');
      output.querySelector('#family-data').textContent = '\n' + JSON.stringify(data, null, 2).replace(/</g, '\\u003c').replace(/>/g, '\\u003e').replace(/&/g, '\\u0026') + '\n';
      downloadFile('<!doctype html>\n' + output.outerHTML, 'Kindrd.local.html', 'text/html');
    });
    byId('print').addEventListener('click', () => window.print());
    window.addEventListener('beforeprint', () => { printCamera = {...camera}; fitView(); });
    window.addEventListener('afterprint', () => { if (printCamera) { camera = printCamera; cameraUpdate(); printCamera = null; } });
    window.addEventListener('resize', () => { if (!printCamera) { if (connectionPath) fitConnection(); else centerOn(selectedId); } });
    function initialize(candidate) {
      data = validateData(candidate);
      people = new Map(data.people.map(person => [person.id, person]));
      selectedId = data.focusPersonId;
      byId('view').value = 'all';
      byId('search').value = '';
      mobileDetailsOpen = false;
      syncDetailsVisibility();
      closeSearch();
      renderTree(); renderDetails(); centerOn(selectedId, true);
    }
    syncDetailsVisibility();
    if (sharedMode) {
      lucide.createIcons();
      byId('load').hidden = true;
      byId('shared-refresh').hidden = false;
      byId('sign-out').hidden = false;
      byId('workspace').inert = true;
      byId('storage-status').textContent = 'Connecting...';
      for (const button of document.querySelectorAll('.toolbar button, #view, #search')) button.disabled = true;
      loadSharedTree(true).catch(error => { byId('message').textContent = error.message; byId('storage-status').textContent = 'Shared tree unavailable'; byId('shared-refresh').disabled = false; });
      window.addEventListener('pageshow', event => { if (event.persisted) location.reload(); });
    } else try {
      let initial = embeddedRecord;
      try {
        lastStored = localStorage.getItem(storageKey);
        byId('contributor').value = localStorage.getItem(contributorKey) || '';
      } catch { storageAvailable = false; byId('storage-status').textContent = 'Session only; not saved locally'; }
      if (lastStored) {
        try {
          const saved = JSON.parse(lastStored);
          validateData(saved.record);
          if (saved.baseline === embeddedSignature) { initial = saved.record; byId('storage-status').textContent = 'Saved on this device'; }
          else { pendingRecovery = saved.record; byId('recovery-bar').hidden = false; }
        } catch { invalidSaved = true; byId('recovery-bar').hidden = false; byId('review-local').disabled = true; byId('message').textContent = 'Saved local data is invalid. The file snapshot is open.'; }
      }
      lucide.createIcons(); initialize(initial);
    }
    catch (error) { byId('message').textContent = 'Could not open tree: ' + error.message; }
  </script>
