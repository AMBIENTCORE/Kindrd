<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Kindrd</title>
  <style>
    :root { --paper: #fff; --canvas: #f6f8f7; --ink: #25322c; --muted: #65726c; --border: #d8dfdb; --green: #236b50; --blue: #315e7a; --amber: #8c5919; --red: #92394a; --orange: #c4510b; --orange-paper: #fff4e8; }
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; color: var(--ink); background: var(--paper); font: 13px/1.5 Verdana, sans-serif; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button, select { cursor: pointer; }
    button { background: var(--paper); border: 1px solid var(--border); border-radius: 4px; }
    button:hover { background: #edf3ef; }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
    header { padding: 8px 12px; border-bottom: 1px solid var(--border); flex: none; }
    #total { color: var(--muted); font-size: 10px; text-align: right; white-space: nowrap; }
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .search { position: relative; flex: 1 1 170px; max-width: 260px; }
    input[type=search], select { width: 100%; min-height: 32px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--paper); }
    #view { font-size: 11px; }
    select { width: auto; max-width: 100%; }
    .tools { display: flex; align-items: center; gap: 3px; }
    .organize-menu { position: relative; }
    .organize-menu summary { list-style: none; }
    .organize-menu summary::-webkit-details-marker { display: none; }
    .organize-options { position: absolute; z-index: 20; top: 38px; right: 0; width: 190px; padding: 4px; border: 1px solid var(--border); background: white; box-shadow: 0 5px 15px #25322c24; }
    .organize-options button { width: 100%; border: 0; border-radius: 0; padding: 8px 10px; background: transparent; text-align: left; font: 11px Verdana, sans-serif; }
    .organize-options button:hover { background: #edf4f0; }
    .tools + .tools { border-left: 1px solid var(--border); padding-left: 6px; }
    .icon-button { display: inline-flex; width: 32px; height: 32px; align-items: center; justify-content: center; flex: none; }
    .icon-button svg { width: 17px; height: 17px; stroke-width: 1.7; }
    #zoom-label { font-size: 11px; min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }
    #search-results { position: absolute; inset: 42px 0 auto; padding: 4px; margin: 0; list-style: none; background: white; border: 1px solid var(--border); box-shadow: 0 5px 15px #25322c18; z-index: 10; max-height: 280px; overflow-y: auto; }
    #search-results button { width: 100%; border: 0; text-align: left; padding: 8px; overflow-wrap: anywhere; }
    #search-results [aria-selected=true] { background: #e5f0e9; }
    #search-results .empty { padding: 9px; color: var(--muted); }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 310px; flex: 1; min-height: 0; }
    .workspace.details-hidden { grid-template-columns: minmax(0, 1fr); }
    .workspace.details-hidden #details { display: none; }
    #viewport { overflow: hidden; position: relative; min-height: 200px; background: radial-gradient(circle, #dce3df 1px, transparent 1px) 0 0 / 20px 20px, var(--canvas); cursor: grab; touch-action: none; user-select: none; }
    #viewport.dragging { cursor: grabbing; }
    #scene { transform-origin: 0 0; position: absolute; left: 0; top: 0; }
    #households { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    .household { position: absolute; pointer-events: auto; border: 1px solid #9ba9a2; border-radius: 7px; background: #f4f7f580; box-shadow: 0 1px 0 #ffffff inset; transition: opacity 140ms, border-color 140ms, background 140ms; }
    #connections { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
    #connections path { fill: none; stroke: #8daca0; stroke-width: 1.6; }
    #connections .partner { stroke: #84908a; stroke-width: 1.4; }
    .person { position: absolute; z-index: 2; width: 222px; height: 128px; padding: 10px 12px; text-align: left; background: white; border-radius: 5px; border: 1px solid #bccac2; display: flex; flex-direction: column; justify-content: center; gap: 4px; cursor: pointer; transition: opacity 140ms; }
    .person.sibling-group::before { content: ''; position: absolute; top: 0; left: 9px; right: 9px; height: 3px; background: var(--sibling-color); }
    #scene.branch-highlight .person.branch-muted, #scene.branch-highlight .household.branch-muted, #connections.branch-highlight path.branch-muted { opacity: .16; }
    #scene.branch-highlight .person.branch-active { box-shadow: 0 0 0 1px var(--sibling-color, #4f7f68); }
    #scene.branch-highlight .household.branch-active { border-color: #4f7f68; background: #e8f1ec; }
    #connections.branch-highlight path.branch-active { stroke: #3f725a; stroke-width: 2.4; }
    .person > * { flex-shrink: 0; }
    .person:hover { background: #f5fbf7; border-color: var(--green); }
    .person.selected { border: 2px solid var(--green); padding: 9px 11px; background: #eaf4ed; }
    .person.identity-uncertain { border-color: var(--orange); border-radius: 0; background: var(--orange-paper); }
    .person.identity-uncertain:hover, .person.identity-uncertain.selected { background: #ffead2; }
    .person.identity-uncertain.selected { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--green); }
    .person-heading { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
    .identity-marker { display: inline-block; width: 10px; height: 10px; flex: 0 0 10px; margin-top: 4px; background: var(--orange); }
    .identity-status { color: #9b3d07; }
    .person-identity { min-width: 0; flex: 1; font-size: var(--person-font-size, 13px); line-height: 1.25; overflow-wrap: anywhere; }
    .person-name { font-weight: bold; }
    .person.name-truncated .person-name { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .person-age { color: var(--red); font-size: 11px; font-weight: normal; white-space: nowrap; }
    .person-dates { font: 11px/1.3 Verdana, sans-serif; color: var(--muted); }
    .person-dates > span { display: block; }
    .person-facts { width: 100%; min-width: 0; font-size: 10px; line-height: 1.4; color: var(--muted); }
    .person-fact { display: flex; align-items: baseline; gap: 4px; min-width: 0; }
    .person-fact-label, .person-fact-marker { flex: none; }
    .person-fact-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .date-value > span { display: inline; }
    .uncertain { color: var(--orange); }
    aside { min-width: 0; overflow: auto; padding: 20px; border-left: 1px solid var(--border); }
    aside h2 { font: 21px/1.3 Georgia, serif; margin: 0 0 8px; overflow-wrap: anywhere; }
    .person-position { font-size: 11px; color: var(--muted); margin: 0 0 20px; }
    h3 { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: normal; margin: 22px 0 8px; }
    dl { margin: 0; }
    dt { color: var(--muted); font-size: 11px; margin-top: 13px; }
    dd { margin: 3px 0 0; overflow-wrap: anywhere; }
    .relative { display: block; width: 100%; border: 0; border-bottom: 1px solid #eef1ef; border-radius: 0; padding: 7px 0; text-align: left; color: var(--green); line-height: 1.5; overflow-wrap: anywhere; }
    .relative:hover { background: #f4f7f5; }
    .note { margin: 8px 0; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .lead { border-left: 2px solid #c89448; padding-left: 10px; margin: 14px 0; font-size: 11px; overflow-wrap: anywhere; }
    .lead strong { color: var(--amber); font-weight: normal; }
    .lead p { margin: 7px 0; }
    a { color: var(--green); text-underline-offset: 2px; }
    .lead a { display: inline-block; margin: 2px 12px 2px 0; }
    .session-meta { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 6px 10px; margin-left: auto; }
    .contributor-field { display: flex; align-items: center; gap: 7px; }
    .contributor-field svg { width: 15px; height: 15px; color: var(--muted); }
    #contributor { width: 150px; min-width: 0; padding: 5px 7px; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; background: transparent; font-size: 11px; }
    #contributor[readonly] { width: 170px; color: var(--muted); }
    #details { display: flex; flex-direction: column; overflow: hidden; padding: 0; }
    .details-header { padding: 18px 18px 12px; flex: none; }
    .sheet-close { display: none; }
    .details-header .person-position { margin: 0; }
    .sidebar-actions { display: flex; gap: 5px; margin-top: 12px; }
    .sidebar-actions .icon-button { width: 30px; height: 30px; }
    .detail-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 1.5fr); border-block: 1px solid var(--border); flex: none; }
    .detail-tabs button { padding: 10px 2px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; font-size: 11px; background: #f8faf9; }
    .detail-tabs [aria-selected=true] { color: var(--green); border-bottom-color: var(--green); background: var(--paper); font-weight: bold; }
    #detail-content { overflow-y: auto; min-height: 0; padding: 0 18px 20px; flex: 1; }
    .panel-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 0; }
    .panel-toolbar select { min-width: 0; max-width: 100%; font-size: 11px; }
    .command { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 32px; padding: 6px 10px; }
    .command svg { width: 15px; height: 15px; flex: none; }
    .primary { color: white; background: var(--green); border-color: var(--green); }
    .primary:hover { background: #19563e; }
    .danger { color: var(--red); border-color: #dcb6bf; }
    .note-protection { display: inline-block; font-size: 10px; color: var(--muted); margin-left: 8px; }
    .record-note { border-bottom: 1px solid var(--border); padding: 12px 0; }
    .record-note .note { white-space: pre-wrap; font-size: 12px; color: var(--ink); }
    .record-note .icon-button, .lead .icon-button { width: 26px; height: 26px; margin-top: 5px; }
    .empty-state { color: var(--muted); font-size: 12px; padding: 18px 0; }
    .activity-entry { border-bottom: 1px solid var(--border); padding: 14px 0; overflow-wrap: anywhere; font-size: 11px; }
    .activity-entry summary { cursor: pointer; }
    .activity-entry summary strong { font-size: 12px; font-weight: normal; }
    .activity-meta { display: block; color: var(--muted); margin-top: 5px; }
    .activity-source { margin: 10px 0; color: var(--muted); white-space: pre-wrap; }
    .change-detail { border-left: 2px solid #91adbd; padding-left: 9px; margin-top: 14px; }
    .change-detail h4 { font-size: 11px; margin: 0 0 5px; }
    .change-detail pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.5 Verdana, sans-serif; margin: 4px 0 10px; }
    .change-detail .before { color: #91424e; }
    .change-detail .after { color: var(--green); }
    #activity-query { min-height: 32px; font-size: 11px; }
    #recovery-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; background: #fff4e8; border-bottom: 1px solid #debd93; padding: 8px 20px; font-size: 11px; }
    dialog { width: min(620px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); border: 1px solid var(--border); border-radius: 6px; padding: 0; box-shadow: 0 14px 60px #25322c35; color: var(--ink); }
    dialog::backdrop { background: #20292566; }
    #record-form { display: flex; flex-direction: column; max-height: calc(100dvh - 36px); }
    .dialog-heading, .dialog-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; flex: none; }
    .dialog-heading { border-bottom: 1px solid var(--border); }
    .dialog-heading h2 { font: 21px/1.25 Georgia, serif; margin: 0; }
    .dialog-footer { border-top: 1px solid var(--border); justify-content: flex-end; }
    .dialog-body { padding: 4px 20px 20px; overflow-y: auto; min-height: 0; }
    .form-field { display: flex; flex-direction: column; gap: 5px; margin-top: 14px; min-width: 0; }
    .form-field > label, .form-check { font-size: 11px; }
    .form-field input, .form-field textarea, .form-field select { width: 100%; min-height: 34px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 3px; background: white; }
    .form-field textarea { resize: vertical; min-height: 76px; }
    .form-field select[multiple] { height: 105px; }
    .field-caption { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 11px; min-height: 22px; }
    .certainty-toggle { display: inline-flex; align-items: center; gap: 4px; flex: none; cursor: pointer; color: var(--muted); font-weight: bold; }
    .certainty-toggle input { width: 13px; min-height: 13px; height: 13px; padding: 0; margin: 0; accent-color: var(--orange); }
    .certainty-toggle:has(:checked) { color: var(--orange); }
    .form-field:has(.certainty-toggle :checked) > input, .form-field:has(.certainty-toggle :checked) > select, .form-field:has(.certainty-toggle :checked) > textarea { border-color: var(--orange); background: var(--orange-paper); }
    .date-fields { border: 0; padding: 0; margin: 22px 0 0; min-width: 0; }
    .date-fields legend { padding: 0; font-size: 12px; font-weight: bold; }
    .date-parts { display: grid; grid-template-columns: 1fr 1.6fr 1.3fr; gap: 10px; }
    .form-check { display: flex; align-items: center; gap: 7px; margin-top: 10px; }
    .form-check input { margin: 0; accent-color: var(--green); }
    .attribution-fields { margin-top: 22px; padding-top: 4px; border-top: 1px solid var(--border); }
    #editor-error { font-size: 12px; color: var(--red); white-space: pre-wrap; }
    .conflict-field { border: 0; border-top: 1px solid var(--border); padding: 14px 0 0; margin: 18px 0; min-width: 0; }
    .conflict-field legend { padding: 0 8px 0 0; font-size: 12px; font-weight: bold; overflow-wrap: anywhere; }
    .conflict-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .conflict-option { display: grid; grid-template-columns: 16px minmax(0, 1fr); align-items: start; gap: 8px; border: 1px solid var(--border); border-radius: 4px; padding: 10px; cursor: pointer; min-width: 0; }
    .conflict-option:has(:checked) { border-color: var(--green); background: #edf5ef; }
    .conflict-option:has(:disabled) { cursor: default; opacity: 0.6; }
    .conflict-option input { margin: 3px 0 0; accent-color: var(--green); }
    .conflict-option strong { font-size: 11px; font-weight: normal; }
    .conflict-value { white-space: pre-wrap; overflow-wrap: anywhere; margin: 7px 0 0; max-height: 180px; overflow: auto; font: 12px/1.5 Verdana, sans-serif; }
    .conflict-original { margin-top: 10px; color: var(--muted); font-size: 11px; }
    #storage-status { color: var(--green); }
    button:disabled { cursor: default; opacity: 0.4; }
    #generations { position: absolute; inset: 0; pointer-events: none; }
    .generation-guide { position: absolute; left: 0; border-top: 1px dashed #d9e2de; width: 100%; height: 1px; }
    .generation-guide span { position: absolute; left: 0; top: -17px; padding-right: 8px; color: #7a8b82; background: var(--canvas); font-size: 9px; text-transform: uppercase; }
    .person.path-muted { opacity: 0.4; }
    .person.path-node:not(.identity-uncertain):not(.selected) { border: 2px solid var(--blue); padding: 9px 11px; background: #edf4f8; }
    .person.path-node.identity-uncertain:not(.selected) { box-shadow: 0 0 0 2px var(--blue); }
    #connections.path-active path:not(.path-link) { opacity: 0.2; }
    #connections path.path-link { stroke: var(--blue); stroke-width: 3; }
    #connection-bar { position: absolute; top: 10px; left: 12px; right: 12px; z-index: 2; display: flex; align-items: flex-start; gap: 10px; padding: 9px 10px; border-left: 3px solid var(--blue); border-bottom: 1px solid var(--border); background: #ffffffed; max-height: 30%; overflow-y: auto; cursor: default; touch-action: pan-y; user-select: text; }
    .connection-info { min-width: 0; flex: 1; }
    .connection-title { font-size: 10px; color: var(--blue); margin: 0 0 4px; }
    .connection-route { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; padding: 0; margin: 0; list-style: none; }
    .connection-route li { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .connection-route button { border: 0; border-radius: 0; background: transparent; font-size: 11px; padding: 3px 0; max-width: 170px; text-align: left; overflow-wrap: anywhere; color: var(--blue); }
    .connection-route span { color: var(--muted); font-size: 9px; }
    .connection-route svg { width: 12px; height: 12px; flex: none; color: var(--muted); }
    footer { flex: none; display: flex; gap: 12px; justify-content: space-between; padding: 7px 20px; border-top: 1px solid var(--border); font-size: 10px; color: var(--muted); flex-wrap: wrap; }
    #message { color: var(--red); }
    [hidden] { display: none !important; }
    @media (max-width: 720px) {
      header { padding: 8px; }
      .session-meta { gap: 5px 10px; }
      #total { font-size: 10px; }
      #contributor { width: 145px; }
      #contributor[readonly] { width: 180px; }
      .search { max-width: none; flex-basis: 100%; }
      .toolbar { gap: 6px; }
      #view { flex: 1; width: 150px; max-width: 150px; font-size: 11px; padding: 6px; }
      .icon-button { width: 32px; height: 34px; }
      .tools { gap: 2px; }
      .tools + .tools { padding-left: 0; border-left: 0; }
      #zoom-label { min-width: 32px; }
      .workspace { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, min(260px, 44%)); }
      .workspace.details-hidden { grid-template-rows: minmax(0, 1fr); }
      aside { border-left: 0; border-top: 1px solid var(--border); }
      aside h2 { font-size: 19px; }
      #details { background: var(--paper); border-radius: 8px 8px 0 0; box-shadow: 0 -3px 12px #25322c10; }
      .details-header { position: relative; padding: 8px 14px; }
      .details-header h2 { font-size: 16px; padding-right: 34px; margin-bottom: 0; }
      .sheet-close { display: inline-flex; position: absolute; top: 5px; right: 7px; width: 30px; height: 30px; }
      .sidebar-actions { margin-top: 6px; align-items: flex-start; }
      .sidebar-actions .icon-button { width: 27px; height: 29px; }
      .details-header .person-position { display: none; }
      .detail-tabs button { padding: 8px 2px; }
      #detail-content { padding: 0 14px 15px; overscroll-behavior: contain; }
      .dialog-heading, .dialog-footer { padding: 12px 14px; }
      .dialog-body { padding: 0 14px 14px; }
      .conflict-options { grid-template-columns: minmax(0, 1fr); }
      footer { padding: 6px 12px; }
    }
    @media print {
      @page { size: A3 landscape; margin: 10mm; }
      body { height: auto; display: block; }
      header { padding: 0 0 10px; }
      .toolbar, .contributor-field, aside, footer, #recovery-bar, dialog, #connection-bar { display: none !important; }
      .workspace { display: block; }
      #viewport { width: 390mm; height: 250mm; background: white; overflow: hidden; }
      .person { print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <header aria-label="Family tree controls">
    <div class="toolbar">
      <div class="search">
        <input id="search" type="search" placeholder="Find a person" aria-label="Find a person" role="combobox" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false" autocomplete="off">
        <ul id="search-results" role="listbox" aria-label="People" hidden></ul>
      </div>
      <select id="view" aria-label="Tree view">
        <option value="all">Entire family</option>
        <option value="family">Family branch of selection</option>
        <option value="ancestors">Ancestors of selection</option>
        <option value="descendants">Descendants of selection</option>
      </select>
      <div class="tools">
        <button class="icon-button" id="zoom-out" title="Zoom out" aria-label="Zoom out"><i data-lucide="minus"></i></button>
        <span id="zoom-label">100%</span>
        <button class="icon-button" id="zoom-in" title="Zoom in" aria-label="Zoom in"><i data-lucide="plus"></i></button>
        <button class="icon-button" id="fit" title="Fit whole tree" aria-label="Fit whole tree"><i data-lucide="maximize"></i></button>
        <button class="icon-button" id="center" title="Center selected person" aria-label="Center selected person"><i data-lucide="locate-fixed"></i></button>
      </div>
      <div class="tools">
        <button class="icon-button" id="connect" title="Find connection between two people" aria-label="Find connection between two people"><i data-lucide="route"></i></button>
        <details class="organize-menu"><summary class="icon-button" title="Organize tree" aria-label="Organize tree"><i data-lucide="network"></i></summary><div class="organize-options"><button id="organize-family">Organize this family</button><button id="organize-tree">Organize whole tree</button></div></details>
        <button class="icon-button" id="undo-layout" title="Undo the last tree organization" aria-label="Undo tree organization" disabled><i data-lucide="undo-2"></i></button>
      </div>
      <div class="tools">
        <button class="icon-button" id="load" title="Load family data" aria-label="Load family data"><i data-lucide="folder-open"></i></button>
        <button class="icon-button" id="download" title="Download family data" aria-label="Download family data"><i data-lucide="download"></i></button>
        <button class="icon-button" id="download-html" title="Download standalone HTML" aria-label="Download standalone HTML"><i data-lucide="file-code-2"></i></button>
        <button class="icon-button" id="history" title="All activity" aria-label="All activity"><i data-lucide="history"></i></button>
        <button class="icon-button" id="shared-refresh" title="Refresh shared tree" aria-label="Refresh shared tree" hidden><i data-lucide="refresh-cw"></i></button>
        <button class="icon-button" id="sign-out" title="Sign out" aria-label="Sign out" hidden><i data-lucide="log-out"></i></button>
        <button class="icon-button" id="print" title="Print tree" aria-label="Print tree"><i data-lucide="printer"></i></button>
        <button class="icon-button" id="toggle-details" title="Toggle person details" aria-label="Toggle person details" aria-controls="details" aria-expanded="true"><i data-lucide="panel-right"></i></button>
      </div>
      <input type="file" id="file" accept=".json,application/json" hidden>
      <div class="session-meta"><span id="total"></span><label class="contributor-field" title="Self-reported contributor"><i data-lucide="user-round" aria-hidden="true"></i><input id="contributor" placeholder="Contributor name" aria-label="Contributor name" maxlength="254" autocomplete="off"></label></div>
    </div>
  </header>

  <script id="family-layout">
    'use strict';
    const FamilyLayout = (() => {
      const width = 222;
      const height = 128;
      const partnerGap = 26;
      const familyGap = 42;
      const margin = 35;

      function initial(record, ids = new Set(record.people.map(person => person.id))) {
        const roots = new Map([...ids].map(id => [id, id]));
        function root(id) { while (roots.get(id) !== id) id = roots.get(id); return id; }
        for (const family of record.families) {
          const parents = family.parentIds.filter(id => ids.has(id));
          for (const parentId of parents.slice(1)) roots.set(root(parentId), root(parents[0]));
        }
        const groups = new Map();
        for (const id of ids) { const key = root(id); if (!groups.has(key)) groups.set(key, []); groups.get(key).push(id); }
        const graph = new dagre.graphlib.Graph();
        graph.setGraph({rankdir: 'TB', nodesep: familyGap, ranksep: 88, marginx: margin, marginy: margin});
        graph.setDefaultEdgeLabel(() => ({}));
        for (const [key, members] of groups) graph.setNode(key, {width: members.length * width + (members.length - 1) * partnerGap, height});
        for (const family of record.families) {
          const parentId = family.parentIds.find(id => ids.has(id));
          if (!parentId) continue;
          for (const childId of family.childIds.filter(id => ids.has(id))) if (root(parentId) !== root(childId)) graph.setEdge(root(parentId), root(childId));
        }
        dagre.layout(graph);
        const positions = new Map();
        const descendants = new Map([...groups.keys()].map(key => [key, new Set()]));
        const incoming = new Map([...groups.keys()].map(key => [key, 0]));
        for (const family of record.families) {
          const parent = family.parentIds.find(id => ids.has(id));
          if (!parent) continue;
          const parentGroup = root(parent);
          for (const childId of family.childIds.filter(id => ids.has(id))) {
            const childGroup = root(childId);
            if (parentGroup === childGroup) continue;
            if (!descendants.get(parentGroup).has(childGroup)) {
              descendants.get(parentGroup).add(childGroup);
              incoming.set(childGroup, incoming.get(childGroup) + 1);
            }
          }
        }
        for (const [key, members] of groups) {
          const group = graph.node(key);
          const parentCenter = id => {
            const parents = record.families.filter(family => family.childIds.includes(id)).flatMap(family => family.parentIds).filter(id => ids.has(id));
            return parents.length ? parents.reduce((sum, id) => sum + graph.node(root(id)).x, 0) / parents.length : group.x;
          };
          members.sort((first, second) => parentCenter(first) - parentCenter(second));

            const group = graph.node(key);
            members.forEach((id, index) => positions.set(id, {x: group.x - group.width / 2 + index * (width + partnerGap), y: group.y - height / 2}));
          }
          return {positions, groups, roots: new Map([...ids].map(id => [id, root(id)]))};

        const treeChildren = new Map([...groups.keys()].map(key => [key, []]));
        const visited = new Set();
        function buildBranch(key) {

          const neighbors = [...descendants.get(key)].sort((first, second) => graph.node(first).x - graph.node(second).x);
          for (const neighbor of neighbors) if (!visited.has(neighbor)) {

            buildBranch(neighbor);
          }

        const orderedRoots = [...groups.keys()].filter(key => incoming.get(key) === 0).sort((first, second) => graph.node(first).x - graph.node(second).x);
        orderedRoots.push(...[...groups.keys()].filter(key => incoming.get(key) > 0).sort((first, second) => graph.node(first).x - graph.node(second).x));
        const forest = [];
        for (const key of orderedRoots) if (!visited.has(key)) { forest.push(key); buildBranch(key); }
        const branchWidths = new Map();
        function measure(key) {
          const children = treeChildren.get(key);
          const childrenWidth = children.reduce((sum, child) => sum + measure(child), 0) + familyGap * Math.max(0, children.length - 1);
          const measured = Math.max(graph.node(key).width, childrenWidth);
          branchWidths.set(key, measured);
          return measured;
        }
        function place(key, left) {
          const blockWidth = branchWidths.get(key);
          const group = graph.node(key);
          const groupLeft = left + (blockWidth - group.width) / 2;
          groups.get(key).forEach((id, index) => positions.set(id, {x: groupLeft + index * (width + partnerGap), y: group.y - height / 2}));
          const children = treeChildren.get(key);
          const childrenWidth = children.reduce((sum, child) => sum + branchWidths.get(child), 0) + familyGap * Math.max(0, children.length - 1);
          let childLeft = left + (blockWidth - childrenWidth) / 2;
          for (const child of children) {
            place(child, childLeft);
            childLeft += branchWidths.get(child) + familyGap;
          }
        }
        let left = margin;
        for (const key of forest) {
          measure(key);
          place(key, left);
          left += branchWidths.get(key) + familyGap;

        const clusterParents = new Map([...groups.keys()].map(key => [key, key]));
        const siblingIds = new Map();
        function clusterRoot(key) { while (clusterParents.get(key) !== key) key = clusterParents.get(key); return key; }

          const children = family.childIds.filter(id => ids.has(id));

            }
          }
        }

      }

        }

          constrain([[id, 1], [members[index - 1], -1]], kiwi.Operator.Le, 420);

          if (!family.childIds.length) continue;

          const siblings = [...family.childIds].sort((first, second) => seed.positions.get(first).x - seed.positions.get(second).x);
          for (const [index, id] of siblings.entries()) if (index && seed.positions.get(id).y === seed.positions.get(siblings[index - 1]).y) {
            const prior = siblings[index - 1];
            constrain([[id, 1], [prior, -1]], kiwi.Operator.Eq, offsets.get(id) - offsets.get(prior), kiwi.Strength.medium);
          }
        }
        solver.updateVariables();
        const left = Math.min(...[...variables.values()].map(variable => variable.value() - width / 2));
        const positions = Object.fromEntries([...seed.positions].map(([id, position]) => [id, {x: Math.round((variables.get(id).value() - width / 2 - left + margin) * 100) / 100, y: position.y}]));
        const layout = {version: 1, topology: FamilyRecord.topologyKey(record), positions};
        FamilyRecord.validateLayout(layout, record);
        return layout;
      }

      function organizeBranch(record, ids, previous = null) {
        const branchIds = new Set(ids);
        if (!previous || branchIds.size === record.people.length) return organize(record, previous);
        const seed = initial(record, branchIds).positions;
        const existing = new Map(Object.entries(previous).map(([id, position]) => [id, {...position}]));

    })();

    let sharedRevision = null;
    const storageKey = 'kindrd-workspace-v1';
    const contributorKey = 'kindrd-contributor-v1';
    const embeddedRecord = JSON.parse(byId('family-data').textContent);
    const embeddedSignature = FamilyRecord.signature(embeddedRecord);
    const standaloneTemplate = document.documentElement.cloneNode(true);
    let lastStored = null;
    let storageAvailable = true;
    let pendingRecovery = null;
    let invalidSaved = false;
    let connectionPath = null;
    let arranging = false;
    let layoutUndo = null;
    let layoutCache = null;

    async function sharedRequest(path, options = {}) {
      const headers = {'Content-Type': 'application/json', ...options.headers};
      if (sharedSession) headers['X-Family-CSRF'] = sharedSession.csrfToken;
      const response = await fetch('./api/' + path, {...options, headers, credentials: 'same-origin', cache: 'no-store', body: options.body === undefined ? undefined : JSON.stringify(options.body)});
      if (response.status === 401) { location.replace('./'); throw new Error('Your session expired. Sign in again.'); }
      const result = await response.json();
      if (!response.ok) { const error = new Error(result.error || 'The shared tree could not be reached.'); error.status = response.status; error.details = result; throw error; }
      return result;
    }

    async function loadSharedTree(firstLoad = false) {
      const current = await sharedRequest('state');
      validateData(current.record);
      sharedSession = {actor: current.actor, csrfToken: current.csrfToken};
      sharedRevision = current.revision;
      byId('contributor').value = current.actor.email;
      byId('contributor').title = current.actor.email + ' (self-reported email)';
      byId('contributor').readOnly = true;
      if (firstLoad) initialize(current.record);
      else {
        data = current.record; people = new Map(data.people.map(person => [person.id, person]));
        if (!people.has(selectedId)) selectedId = data.focusPersonId;
        connectionPath = null; renderTree(); renderDetails(); centerOn(selectedId);
      }
      byId('storage-status').textContent = 'Shared tree · Revision ' + sharedRevision;
      byId('message').textContent = '';
      byId('workspace').inert = false;
      for (const button of document.querySelectorAll('.toolbar button, #view, #search')) button.disabled = false;
      updateLayoutButtons();
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function iconButton(label, icon, action, className = 'icon-button') {
      const button = element('button', className);
      button.type = 'button';
      button.title = label;
      button.setAttribute('aria-label', label);
      const image = element('i');
      image.dataset.lucide = icon;
      image.setAttribute('aria-hidden', 'true');
      button.append(image);
      if (className.includes('command')) button.append(element('span', '', label));
      button.addEventListener('click', action);
      return button;
    }

    function inputField(parent, id, label, value = '', options = {}) {
      const wrapper = element('div', 'form-field');
      const caption = element('label', '', label);
      caption.htmlFor = id;
      const input = element(options.items ? 'select' : options.multiline ? 'textarea' : 'input');
      input.id = id;
      if (input.tagName === 'INPUT') input.type = options.type || 'text';
      if (options.items) for (const item of options.items) { const choice = element('option', '', item.label); choice.value = item.value; input.append(choice); }
      input.value = value ?? '';
      if (options.required) input.required = true;
      if (options.min !== undefined) input.min = options.min;
      if (options.max !== undefined) input.max = options.max;
      if (options.maxLength) input.maxLength = options.maxLength;
      wrapper.append(caption, input);
      parent.append(wrapper);
      return input;
    }

    function checkboxField(parent, id, label, checked) {
      const wrapper = element('label', 'form-check');
      const input = element('input');
      input.type = 'checkbox'; input.id = id; input.checked = Boolean(checked);
      wrapper.append(input, element('span', '', label));
      parent.append(wrapper);
      return input;
    }

    function openEditor(title, build, save, summary, submitLabel = 'Save change', attribution = true) {
      if (byId('record-dialog').open) throw new Error('Close the current editor first.');
      editorBaseline = sharedMode && attribution ? {record: FamilyRecord.copy(data), revision: sharedRevision} : null;
      editorTitle = title; editorSubmitLabel = submitLabel; conflictReview = null;
      byId('editor-title').textContent = title;
      byId('editor-fields').replaceChildren();
      byId('editor-fields').hidden = false;
      byId('editor-conflicts').replaceChildren(); byId('editor-conflicts').hidden = true;
      byId('editor-attribution').replaceChildren();
      byId('editor-attribution').hidden = !attribution;
      byId('editor-error').textContent = '';
      byId('editor-save').textContent = submitLabel;
      byId('editor-cancel').textContent = 'Cancel';
      build(byId('editor-fields'));
      if (attribution) {
        const actor = inputField(byId('editor-attribution'), 'edit-actor', sharedMode ? 'Email (self-reported)' : 'Contributor (self-reported)', byId('contributor').value, {required: true, maxLength: sharedMode ? 254 : 80});
        actor.readOnly = sharedMode;
        inputField(byId('editor-attribution'), 'edit-source', 'Source / reference', '', {maxLength: 2000});
        inputField(byId('editor-attribution'), 'edit-summary', 'Change summary', summary, {required: true, maxLength: 500});
      }
      editorSave = save;
      lucide.createIcons();
      byId('record-dialog').showModal();
      byId('record-dialog').querySelector('.dialog-body').scrollTop = 0;
    }

    function persistRecord(candidate) {
      if (pendingRecovery || invalidSaved) throw new Error('Review the saved local tree before saving changes.');
      if (!storageAvailable) return;
      if (localStorage.getItem(storageKey) !== lastStored) throw new Error('Another tab changed the saved tree. Reload before saving.');
      const serialized = JSON.stringify({baseline: embeddedSignature, record: candidate});
      try { localStorage.setItem(storageKey, serialized); }
      catch { throw new Error('Local save failed. Download a backup before making more changes.'); }
      lastStored = serialized;
    }

    function rememberContributor(name) {
      if (sharedMode) return;
      byId('contributor').value = name.trim();
      try { localStorage.setItem(contributorKey, name.trim()); } catch {}
    }

    async function saveRecord(candidate, action, preferredId = selectedId, operation = null) {
      validateData(candidate);
      FamilyRecord.validateEdits(data, candidate);
      if (sharedMode) {
        if (action === 'import') throw new Error('Bulk imports are only available in offline copies.');
        const original = editorBaseline?.record ?? data;
        const updates = [];
        for (const collection of ['people', 'families', 'researchLeads']) {
          const previous = new Map((original[collection] ?? []).map(item => [item.id, item]));
          for (const value of candidate[collection] ?? []) if (!FamilyRecord.equal(previous.get(value.id), value)) updates.push({collection, value, before: previous.get(value.id) ?? null});
        }
        if (!operation && !updates.length) { byId('editor-error').textContent = 'No changes to save.'; return false; }
        const request = {revision: editorBaseline?.revision ?? sharedRevision, ...(operation ?? {updates}), source: byId('edit-source').value, summary: byId('edit-summary').value};
        if (operation?.deletePersonId) request.before = FamilyRecord.deletionContext(original, operation.deletePersonId);
        if (operation?.deleteNote) {
          const person = original.people.find(item => item.id === operation.deleteNote.personId);
          request.before = person.notes[FamilyRecord.noteIdsFor(person).indexOf(operation.deleteNote.noteId)];
        }
        return submitSharedChange(request, action, preferredId);
      }
      const updated = FamilyRecord.commit(data, candidate, {actor: byId('edit-actor').value, action, source: byId('edit-source').value, summary: byId('edit-summary').value});
      if (!updated) { byId('editor-error').textContent = 'No changes to save.'; return false; }
      validateData(updated); persistRecord(updated); rememberContributor(byId('edit-actor').value);
      applySavedRecord(updated, action, preferredId);
      return true;
    }

    function applySavedRecord(updated, action, preferredId) {
      data = updated;
      people = new Map(data.people.map(person => [person.id, person]));
      selectedId = people.has(preferredId) ? preferredId : data.focusPersonId;
      if (action === 'add' || action === 'import' || action === 'delete') byId('view').value = 'all';
      connectionPath = null;
      closeSearch(); byId('search').value = '';
      renderTree(); renderDetails(); centerOn(selectedId);
      byId('message').textContent = '';
      byId('storage-status').textContent = sharedMode ? 'Shared tree · Revision ' + sharedRevision : storageAvailable ? 'Saved on this device' : 'Session only; not saved locally';
    }

    async function submitSharedChange(request, action, preferredId) {
      try {
        const result = request ? await sharedRequest('state', {method: 'PATCH', body: request}) : await sharedRequest('state');
        validateData(result.record);
        sharedRevision = result.revision;
        applySavedRecord(result.record, action, preferredId);
        conflictReview = null;
        return true;
      } catch (error) {
        if (error.status === 409 && error.details.conflicts?.length && error.details.request) {
          conflictReview = {...error.details, action, preferredId};
          renderConflictReview();
          return false;
        }
        throw error;
      }
    }

    function returnToDraft() {
      conflictReview = null;
      byId('editor-conflicts').replaceChildren(); byId('editor-conflicts').hidden = true;
      byId('editor-fields').hidden = false;
      byId('editor-title').textContent = editorTitle;
      byId('editor-save').textContent = editorSubmitLabel;
      byId('editor-cancel').textContent = 'Cancel';
      byId('editor-error').textContent = '';
      byId('record-dialog').querySelector('.dialog-body').scrollTop = 0;
    }

    function renderConflictReview() {
      const panel = byId('editor-conflicts'); panel.replaceChildren(); panel.hidden = false;
      byId('editor-fields').hidden = true;
      byId('editor-title').textContent = 'Review conflicting changes';
      byId('editor-cancel').textContent = 'Back to draft';
      byId('editor-error').textContent = '';
      panel.append(element('p', 'note', conflictReview.error));
      const text = value => value === null ? 'Not recorded' : typeof value === 'string' ? value : JSON.stringify(value, null, 2);
      for (const [index, conflict] of conflictReview.conflicts.entries()) {
        const field = element('fieldset', 'conflict-field'); field.dataset.conflictIndex = index;
        const label = conflict.path[0] === 'notes' ? 'Note' : conflict.path.length ? conflict.path.join(' / ') : conflict.operation ? 'Record and links' : 'Record';
        field.append(element('legend', '', conflict.entityName + ' / ' + label));
        const options = element('div', 'conflict-options');
        for (const [choice, title] of [['mine', conflict.operation ? 'Delete latest version' : 'My value'], ['latest', conflict.operation ? 'Keep latest version' : 'Latest saved value']]) {
          const option = element('label', 'conflict-option');
          const radio = element('input'); radio.type = 'radio'; radio.name = 'conflict-' + index; radio.value = choice; radio.required = true;
          radio.setAttribute('aria-label', title + ' for ' + label);
          if (choice === 'mine' && !conflict.allowMine) radio.disabled = true;
          const content = element('span');
          content.append(element('strong', '', title), element('pre', 'conflict-value', conflict.operation && choice === 'mine' ? 'Delete' : conflict.deleted && choice === 'latest' ? 'Record deleted' : text(conflict[choice])));
          option.append(radio, content); options.append(option);
        }
        const original = element('details', 'conflict-original');
        original.append(element('summary', '', 'Original value'), element('pre', 'conflict-value', text(conflict.before)));
        field.append(options, original);
        if (!conflict.allowMine) field.append(element('p', 'note', conflict.deleted ? 'This record was deleted by another contributor.' : 'A record with this identifier already exists.'));
        panel.append(field);
      }
      lucide.createIcons();
      byId('record-dialog').querySelector('.dialog-body').scrollTop = 0;
      panel.querySelector('input:not(:disabled)')?.focus({preventScroll: true});
    }

    async function saveConflictChoices() {
      const review = conflictReview;
      let request = FamilyRecord.copy(review.request);
      for (const [index, conflict] of review.conflicts.entries()) {
        const choice = byId('editor-conflicts').querySelector('input[name="conflict-' + index + '"]:checked')?.value;
        if (!choice) throw new Error('Choose a value for each conflict.');
        if (conflict.operation) {
          if (choice === 'latest') request = null;
        } else {
          const update = request.updates[conflict.updateIndex];
          update.value = FamilyRecord.resolveField(update.value, conflict.path, conflict[choice], update.collection);
        }
      }
      if (request?.updates) {
        request.updates = request.updates.filter(update => update.value !== null && !FamilyRecord.equal(update.value, update.before));
        if (!request.updates.length) request = null;
      }
      if (request) { request.summary = byId('edit-summary').value; request.source = byId('edit-source').value; }
      return submitSharedChange(request, review.action, review.preferredId);
    }

    function isUncertain(person, field) {
      if (Object.hasOwn(person.fieldCertainty ?? {}, field)) return person.fieldCertainty[field] === 'uncertain';
      const [event, part] = field.split('.');
      if (!['birth', 'death'].includes(event)) return false;
      return part === 'place' ? person[event]?.placeCertainty === 'uncertain' : ['day', 'month', 'year'].includes(part) && person[event]?.dateCertainty === 'uncertain';
    }

    function factualInput(parent, id, label, value, person, field, options = {}) {
      const input = inputField(parent, id, label, value, options);
      const wrapper = input.parentElement;
      const caption = wrapper.querySelector('label');
      const row = element('div', 'field-caption');
      const control = element('label', 'certainty-toggle');
      control.title = 'Uncertain: ' + field.replaceAll('.', ' ');
      const checkbox = element('input'); checkbox.type = 'checkbox'; checkbox.id = id + '-uncertain'; checkbox.dataset.certaintyField = field;
      checkbox.setAttribute('aria-label', 'Uncertain ' + field.replaceAll('.', ' '));
      checkbox.checked = isUncertain(person, field);
      control.append(checkbox, element('span', '', '?'));
      row.append(caption, control); wrapper.prepend(row);
      return input;
    }

    function fieldValue(person, field, value, className = '') {
      const known = value !== null && value !== undefined && value !== '';
      const uncertain = known && isUncertain(person, field);
      const node = element('span', className + (uncertain ? ' uncertain' : ''), (known ? String(value) : 'Unknown') + (uncertain ? ' ?' : ''));
      node.dataset.valueField = field;
      if (uncertain) node.title = 'Uncertain ' + field.replaceAll('.', ' ');
      return node;
    }

    function dateValue(person, event) {
      const value = element('span', 'date-value');
      const date = person[event];
      if (!date || [date.day, date.month, date.year].every(part => part == null)) { value.textContent = 'Unknown'; return value; }
      for (const [part, text] of [['day', date.day], ['month', date.month == null ? null : months[date.month - 1]], ['year', date.year]]) {
        if (text == null) continue;
        if (value.childNodes.length) value.append(' ');
        value.append(fieldValue(person, event + '.' + part, text));
      }
      if (date.year == null) value.append(' (year unknown)');
      return value;
    }

    function personFields(parent, person) {
      factualInput(parent, 'edit-name', people.has(person.id) ? 'Full name' : 'Full name (first and last)', person.name, person, 'name', {required: true, maxLength: 300});
      factualInput(parent, 'edit-variants', 'Name variants (one per line)', (person.nameVariants ?? []).join('\n'), person, 'nameVariants', {multiline: true});
      for (const [field, title] of [['birth', 'Birth'], ['death', 'Death']]) {
        const group = element('fieldset', 'date-fields');
        group.append(element('legend', '', title));
        const parts = element('div', 'date-parts');
        factualInput(parts, 'edit-' + field + '-day', 'Day', person[field]?.day, person, field + '.day', {type: 'number', min: 1, max: 31});
        factualInput(parts, 'edit-' + field + '-month', 'Month', person[field]?.month, person, field + '.month', {items: [{value: '', label: 'Unknown'}, ...months.map((month, index) => ({value: String(index + 1), label: month}))]});
        factualInput(parts, 'edit-' + field + '-year', 'Year', person[field]?.year, person, field + '.year', {type: 'number', min: 1, max: 9999});
        group.append(parts);
        factualInput(group, 'edit-' + field + '-place', 'Place', person[field]?.place, person, field + '.place');
        if (field === 'death') factualInput(group, 'edit-death-age', 'Age at death (years)', person.death?.age, person, 'death.age', {type: 'number', min: 0, max: 150});
        parent.append(group);
      }
      factualInput(parent, 'edit-origin', 'Family origin', person.origin, person, 'origin');
      factualInput(parent, 'edit-movedTo', 'Moved to', person.movedTo, person, 'movedTo');
      inputField(parent, 'edit-identification', 'Identification status', person.identification?.status ?? '', {items: [{value: '', label: 'Not assessed'}, {value: 'uncertain', label: 'Uncertain identification'}, {value: 'confirmed', label: 'Confirmed (family assessment)'}]});
      factualInput(parent, 'edit-confidence', 'Confidence estimate (%)', person.identification?.confidencePercent, person, 'identification.confidencePercent', {type: 'number', min: 0, max: 100});
      factualInput(parent, 'edit-basis', 'Assessment basis', person.identification?.basis, person, 'identification.basis', {multiline: true});
    }

    const lines = text => text.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
    function readPerson(original) {
      const person = FamilyRecord.copy(original);
      person.name = byId('edit-name').value.trim();
      if (!person.name) throw new Error('Enter a name.');
      if (!FamilyRecord.initialPersonIds.includes(person.id) && !FamilyRecord.hasFullName(person.name)) throw new Error('Enter at least a first and last name.');
      const variants = lines(byId('edit-variants').value);
      if (variants.length || person.nameVariants) person.nameVariants = variants;
      for (const field of ['birth', 'death']) {
        const event = {...person[field]};
        for (const part of ['day', 'month', 'year']) {
          const value = byId('edit-' + field + '-' + part).value;
          if (value !== '') event[part] = Number(value);
          else if (Object.hasOwn(event, part)) event[part] = null;
        }
        const place = byId('edit-' + field + '-place').value.trim();
        if (place || Object.hasOwn(event, 'place')) event.place = place || null;
        if (field === 'death') { const age = byId('edit-death-age').value; if (age !== '' || Object.hasOwn(event, 'age')) event.age = age === '' ? null : Number(age); }
        if (Object.keys(event).length) person[field] = event;
      }
      for (const key of ['origin', 'movedTo']) { const value = byId('edit-' + key).value.trim(); if (value || Object.hasOwn(person, key)) person[key] = value || null; }
      const status = byId('edit-identification').value;
      if (status) {
        person.identification = {...person.identification, status};
        const confidence = byId('edit-confidence').value;
        if (confidence !== '') person.identification.confidencePercent = Number(confidence);
        else delete person.identification.confidencePercent;
        const basis = byId('edit-basis').value.trim();
        if (basis || person.identification.basis) person.identification.basis = basis;
      } else {
        if (byId('edit-confidence').value || byId('edit-basis').value.trim()) throw new Error('Choose an identification status for this assessment.');
        delete person.identification;
      }
      for (const checkbox of byId('editor-fields').querySelectorAll('[data-certainty-field]')) {
        const field = checkbox.dataset.certaintyField;
        if (checkbox.checked !== isUncertain(original, field)) {
          person.fieldCertainty ??= {};
          person.fieldCertainty[field] = checkbox.checked ? 'uncertain' : 'confirmed';
        }
      }
      return person;
    }

    function editPerson() {
      const original = people.get(selectedId);
      openEditor('Edit person', parent => personFields(parent, original), () => {
        const candidate = FamilyRecord.copy(data);
        candidate.people[candidate.people.findIndex(person => person.id === original.id)] = readPerson(original);
        return saveRecord(candidate, 'edit');
      }, 'Updated ' + original.name);
    }

    function addRelative(defaultRole = 'child') {
      const anchorId = selectedId;
      const anchor = people.get(anchorId);
      const newId = 'person-' + crypto.randomUUID();
      const newFamilyId = 'family-' + crypto.randomUUID();
      openEditor('Add relative', parent => {
        const role = inputField(parent, 'edit-role', 'Relationship to ' + anchor.name, defaultRole, {items: [{value: 'child', label: 'Child'}, {value: 'parent', label: 'Parent'}, {value: 'partner', label: 'Partner / co-parent'}, {value: 'sibling', label: 'Sibling'}]});
        const group = inputField(parent, 'edit-family', 'Family group', '', {items: []});
        function chooseFamilies() {
          group.replaceChildren();
          const parentRole = ['parent', 'sibling'].includes(role.value);
          if (role.value !== 'sibling') { const choice = element('option', '', role.value === 'partner' ? 'Separate partnership (no children)' : 'New family group'); choice.value = ''; group.append(choice); }
          const families = data.families.filter(family => (parentRole ? family.childIds : family.parentIds).includes(anchorId));
          for (const family of families) { const choice = element('option', '', family.parentIds.map(id => people.get(id).name).join(' + ') + ' (' + family.childIds.length + ' children)'); choice.value = family.id; group.append(choice); }
          if (families.length === 1 && role.value !== 'partner') group.value = families[0].id;
          if (role.value === 'sibling' && !families.length) { const choice = element('option', '', 'No parent group recorded'); choice.value = ''; group.append(choice); }
        }
        role.addEventListener('change', chooseFamilies); chooseFamilies();
        personFields(parent, {id: newId, name: ''});
      }, () => {
        const candidate = FamilyRecord.copy(data);
        candidate.people.push(readPerson({id: newId, name: ''}));
        const role = byId('edit-role').value;
        let family = candidate.families.find(item => item.id === byId('edit-family').value);
        if (role === 'sibling' && !family) throw new Error('Record a parent before adding a sibling.');
        if (!family) {
          family = {id: newFamilyId, parentIds: role === 'parent' ? [] : [anchorId], childIds: role === 'parent' ? [anchorId] : [], relationshipStatus: 'unknown'};
          candidate.families.push(family);
        }
        if (role === 'child' || role === 'sibling') { family.childIds.push(newId); delete family.childrenListComplete; }
        else family.parentIds.push(newId);
        return saveRecord(candidate, 'add', newId);
      }, 'Added a relative of ' + anchor.name, 'Add relative');
    }

    function editNote(index = null) {
      const personId = selectedId;
      const person = people.get(personId);
      const newNoteId = 'note-' + crypto.randomUUID();
      openEditor(index === null ? 'Add note' : 'Edit note', parent => inputField(parent, 'edit-note', 'Note', index === null ? '' : person.notes[index], {multiline: true, required: true}), () => {
        const note = byId('edit-note').value.trim();
        if (!note) throw new Error('Enter a note.');
        const candidate = FamilyRecord.copy(data);
        const target = candidate.people.find(item => item.id === personId);
        target.notes ??= [];
        target.noteIds = [...FamilyRecord.noteIdsFor(target)];
        if (index === null) { target.notes.push(note); target.noteIds.push(newNoteId); } else target.notes[index] = note;
        return saveRecord(candidate, 'edit');
      }, (index === null ? 'Added a note for ' : 'Updated a note for ') + person.name);
    }

    function deletePerson() {
      const person = people.get(selectedId);
      if (FamilyRecord.initialPersonIds.includes(person.id)) return;
      const candidate = FamilyRecord.removePerson(data, person.id);
      const related = data.families.filter(family => [...family.parentIds, ...family.childIds].includes(person.id)).flatMap(family => [...family.parentIds, ...family.childIds]).find(id => id !== person.id);
      openEditor('Delete person?', parent => {
        parent.append(element('p', '', person.name), element('p', 'note', 'This record and its links will be removed. Other people and the activity history will remain.'));
      }, () => saveRecord(candidate, 'delete', related ?? candidate.focusPersonId, {deletePersonId: person.id}), 'Deleted ' + person.name, 'Delete person');
    }

    function deleteNote(index) {
      const person = people.get(selectedId);
      const noteId = FamilyRecord.noteIdsFor(person)[index];
      if (FamilyRecord.protectedNoteIds(person.id).includes(noteId)) return;
      openEditor('Delete note?', parent => parent.append(element('p', 'note', person.notes[index])), () => saveRecord(FamilyRecord.removeNote(data, person.id, noteId), 'delete', person.id, {deleteNote: {personId: person.id, noteId}}), 'Deleted a note for ' + person.name, 'Delete note');
    }

    function editEvidence(leadId = null) {
      const original = data.researchLeads?.find(lead => lead.id === leadId) ?? {id: 'research-' + crypto.randomUUID(), personIds: [selectedId], status: 'Unverified contribution', summary: '', sourceUrls: []};
      openEditor(leadId ? 'Edit evidence' : 'Add evidence', parent => {
        inputField(parent, 'edit-evidence-status', 'Research status', original.status, {required: true});
        inputField(parent, 'edit-evidence-summary', 'Finding / evidence', original.summary, {multiline: true, required: true});
        inputField(parent, 'edit-evidence-reference', 'Archive / document reference', original.reference);
        inputField(parent, 'edit-evidence-urls', 'Source URLs (one per line)', (original.sourceUrls ?? []).join('\n'), {multiline: true});
        const linked = inputField(parent, 'edit-evidence-people', 'Linked people', '', {items: data.people.map(person => ({value: person.id, label: person.name || 'Name unknown'})), required: true});
        linked.multiple = true;

        if (!updated.status || !updated.summary || !updated.personIds.length) throw new Error('Supply a finding, status and linked person.');
        for (const address of updated.sourceUrls) { let url; try { url = new URL(address); } catch { throw new Error('Enter a complete source URL.'); } if (!['https:', 'http:'].includes(url.protocol)) throw new Error('Source URLs must use http or https.'); }
        const candidate = FamilyRecord.copy(data);

        const index = candidate.researchLeads.findIndex(lead => lead.id === updated.id);

    function reviewImport(candidate, filename, recovering = false) {
      if (sharedMode) throw new Error('Bulk imports are only available in offline copies.');
      validateData(candidate);
      const changes = FamilyRecord.changesBetween(data, candidate);
      openEditor('Review imported tree', parent => {
        parent.append(element('p', '', filename), element('p', '', candidate.people.length + ' people / ' + candidate.families.length + ' family groups'), element('p', 'identity-status', 'Replaces the local tree; recorded histories are retained.'), element('p', '', changes.length + ' changes'));
        const preview = element('details'); preview.append(element('summary', '', 'Before / after'), changeDetails(changes)); parent.append(preview);
      }, async () => {
        const recovery = pendingRecovery;
        if (recovering) pendingRecovery = null;
        try {
          if (recovering && FamilyRecord.equal(data, candidate)) {
            persistRecord(data); byId('recovery-bar').hidden = true; byId('storage-status').textContent = 'Saved on this device'; return true;
          }
          const saved = await saveRecord(candidate, 'import', candidate.focusPersonId);
          if (saved) { pendingRecovery = null; byId('recovery-bar').hidden = true; }
          else pendingRecovery = recovery;
          return saved;
        } catch (error) { pendingRecovery = recovery; throw error; }
      }, 'Imported ' + filename, 'Import snapshot');
    }

    function dateText(event) {
      if (!event || [event.day, event.month, event.year].every(value => value == null)) return 'Unknown';
      const parts = [];
      if (event.day != null) parts.push(String(event.day));
      if (event.month != null) parts.push(months[event.month - 1]);
      if (event.year != null) parts.push(String(event.year));
      else parts.push('(year unknown)');
      return parts.join(' ') + (event.dateCertainty === 'uncertain' ? ' ?' : '');
    }

    function identificationText(person) {
      if (person.identification?.status !== 'uncertain') return '';
      const confidence = person.identification.confidencePercent;
      return 'Uncertain identification' + (confidence != null ? `; ${confidence}% confidence (family estimate)` : '');
    }

    function relatedClosure(startId, direction) {
      const found = new Set([startId]);
      const queue = [startId];
      while (queue.length) {
        const currentId = queue.shift();
        for (const family of data.families) {
          const from = direction === 'up' ? family.childIds : family.parentIds;
          const to = direction === 'up' ? family.parentIds : family.childIds;
          if (from.includes(currentId)) for (const memberId of to) if (!found.has(memberId)) { found.add(memberId); queue.push(memberId); }
        }
      }
      return found;
    }

    function addPartners(ids) {
      const original = new Set(ids);
      for (const family of data.families) if (family.parentIds.some(id => original.has(id))) for (const id of family.parentIds) ids.add(id);
      return ids;
    }

    function familyBranch(startId) {
      const parentFamilies = data.families.filter(family => family.childIds.includes(startId));
      const siblingIds = new Set(parentFamilies.flatMap(family => family.childIds));
      if (!siblingIds.size) siblingIds.add(startId);
      const branch = new Set(parentFamilies.flatMap(family => family.parentIds));
      for (const siblingId of siblingIds) for (const id of relatedClosure(siblingId, 'down')) branch.add(id);
      return addPartners(branch);
    }

    function visiblePeople() {
      const mode = byId('view').value;
      return mode === 'family' ? familyBranch(selectedId) : mode === 'ancestors' ? relatedClosure(selectedId, 'up') : mode === 'descendants' ? addPartners(relatedClosure(selectedId, 'down')) : new Set(people.keys());
    }

    function findConnection(firstId, lastId) {
      if (!people.has(firstId) || !people.has(lastId)) return null;
      const graph = new dagre.graphlib.Graph({directed: false});
      for (const id of people.keys()) graph.setNode(id);
      for (const family of data.families) {
        for (const [index, parentId] of family.parentIds.entries()) {
          for (const partnerId of family.parentIds.slice(index + 1)) graph.setEdge(parentId, partnerId, {familyId: family.id, kind: 'partner'});
          for (const childId of family.childIds) graph.setEdge(parentId, childId, {familyId: family.id, kind: 'parent-child', parentId, childId});
        }
      }
      const paths = dagre.graphlib.alg.dijkstra(graph, firstId, () => 1, id => graph.nodeEdges(id));
      if (!Number.isFinite(paths[lastId].distance)) return null;
      const nodes = [lastId];
      while (nodes[0] !== firstId) nodes.unshift(paths[nodes[0]].predecessor);
      const steps = nodes.slice(1).map((id, index) => ({...graph.edge(nodes[index], id), from: nodes[index], to: id}));
      return {nodes, steps};
    }

    function openConnection() {
      const choices = [...people.values()].sort((first, second) => (first.name || '').localeCompare(second.name || '')).map(person => ({value: person.id, label: person.name || 'Name unknown'}));
      openEditor('Find connection', parent => {
        inputField(parent, 'connection-from', 'From', connectionPath?.nodes[0] ?? selectedId, {items: choices, required: true});
        inputField(parent, 'connection-to', 'To', connectionPath?.nodes.at(-1) ?? choices.find(person => person.value !== selectedId)?.value ?? selectedId, {items: choices, required: true});
      }, () => {
        const path = findConnection(byId('connection-from').value, byId('connection-to').value);
        if (!path) throw new Error('No connection is recorded between these people.');
        connectionPath = path;
        byId('view').value = 'all';
        renderTree(); fitConnection();
      }, '', 'Show connection', false);
    }

    function fitConnection() {
      const points = connectionPath.nodes.map(id => positions.get(id));
      const left = Math.min(...points.map(point => point.x));
      const top = Math.min(...points.map(point => point.y));
      const width = Math.max(...points.map(point => point.x)) + cardWidth - left;
      const height = Math.max(...points.map(point => point.y)) + cardHeight - top;
      const barHeight = byId('connection-bar').offsetHeight + 25;
      const scale = Math.max(0.01, Math.min(1, (viewport.clientWidth - 40) / width, (viewport.clientHeight - barHeight - 25) / height));
      camera = {scale, x: (viewport.clientWidth - width * scale) / 2 - left * scale, y: barHeight + (viewport.clientHeight - barHeight - height * scale) / 2 - top * scale};
      cameraUpdate();
    }

    function renderConnection() {
      const bar = byId('connection-bar');
      bar.replaceChildren(); bar.hidden = !connectionPath;
      edgesLayer.classList.toggle('path-active', Boolean(connectionPath));
      for (const node of peopleLayer.querySelectorAll('.person')) {

      if (!connectionPath) return;

        }
